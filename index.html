<style>
/* Layout: a tree-themed phone app. You are the crown, your family are the roots. Three tabs (Insights, Root, Family) with Root as the raised centre button; settings behind a gear. Deliberately single light theme, garden greens with one earth tone for roots. */
:root{
  color-scheme:light;
  --page:#E7EBE3; --app:#F5F6F1; --white:#FFFFFF; --ink:#15231B; --ink-2:#55635A; --line:#DFE4DA;
  --forest:#1D4A37; --on-forest:#F3F8EF;
  --lime:#D3EE7C; --lime-ink:#2C3A08;
  --moss:#AFC8A0; --moss-ink:#1C3A26;
  --mint:#D5EADB; --mint-ink:#1B4733;
  --pista:#DCE5B4; --pista-ink:#3B4711;
  --euca:#A9D0C3; --euca-ink:#123F33;
  --apricot:#F3CFA8; --apricot-ink:#6A3510;
  --soil:#ECE6D5; --root:#6B5B3A;
  --font:"Instrument Sans","Noto Sans Tamil","Noto Sans Devanagari",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--page)}
body{color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-weight:600;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:40px;line-height:1}
h2{font-size:18px}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--forest);outline-offset:2px}
.phone{max-width:420px;margin:0 auto;background:var(--app);border:10px solid #17211B;border-radius:48px;padding:22px 18px 0;min-height:820px;position:relative;display:flex;flex-direction:column}
@media (max-width:520px){body{padding-block:0}.phone{border:0;border-radius:0;padding:14px 0 0;min-height:100vh} html,body{background:var(--app)}}
.screen{flex:1;display:flex;flex-direction:column;gap:18px;padding-bottom:120px}
.top{display:flex;align-items:center;gap:8px}
.pills{display:flex;gap:8px;flex:1;flex-wrap:wrap}
.pill{min-height:44px;padding:0 20px;border-radius:999px;border:1.5px solid #C9CFC4;background:transparent;font-weight:600;font-size:15px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--app)}
.round{width:46px;height:46px;border-radius:50%;border:0;background:#E2E6DD;display:grid;place-items:center;cursor:pointer;flex:none;color:var(--ink);text-decoration:none}
.kicker{font-size:16px;color:var(--ink-2)}
.big{font-size:76px;line-height:.86;font-weight:600;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.big small{display:block;font-size:44px;letter-spacing:-.04em}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.side{border-left:1.5px solid var(--ink);padding-left:16px;display:flex;flex-direction:column;gap:10px}
.side b{display:block;font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.side span{font-size:13px;color:var(--ink-2)}
.sheet{background:var(--white);border-radius:30px;padding:18px 12px 12px;display:flex;flex-direction:column;gap:10px;margin-inline:-6px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:0 8px 2px;gap:8px}
.tag{font-size:13px;font-weight:600;padding:7px 13px;border-radius:999px;background:var(--app);white-space:nowrap}
.card{border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:14px;border:0;text-align:left;width:100%}
.tap{cursor:pointer}
.t-moss{background:var(--moss);color:var(--moss-ink)} .t-mint{background:var(--mint);color:var(--mint-ink)}
.t-pista{background:var(--pista);color:var(--pista-ink)} .t-euca{background:var(--euca);color:var(--euca-ink)}
.t-forest{background:var(--forest);color:var(--on-forest)} .t-white{background:var(--white);color:var(--ink)}
.t-apricot{background:var(--apricot);color:var(--apricot-ink)}
.card h3{font-size:24px;line-height:1.08;font-weight:600;letter-spacing:-.03em}
.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.faces{display:flex;flex:none}
.face{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:2px solid currentColor;margin-left:-8px;background:var(--white);color:var(--ink);flex:none}
.face:first-child{margin-left:0}
.f-you{background:var(--lime);color:var(--lime-ink)} .f-amma{background:var(--forest);color:var(--on-forest)} .f-paati{background:#E9F3EC;color:var(--euca-ink)} .f-lab{background:var(--white);color:var(--ink);font-size:9px}
.stats{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px}
.stats b{display:block;font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-size:13px;opacity:.85}
.stats .r{text-align:right}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;background:rgba(21,35,27,.82);color:#F5F6F1;white-space:nowrap}

.detail{background:rgba(255,255,255,.55);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;font-size:15px}

.ev .face{width:26px;height:26px;font-size:11px;border-width:0;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;border:0;background:var(--ink);color:var(--app);font-weight:600;cursor:pointer;text-decoration:none}
.btn.lime{background:var(--lime);color:var(--lime-ink)}
.btn.light{background:rgba(255,255,255,.18);color:inherit}
.btn.ghost{background:transparent;color:inherit;border:1.5px solid currentColor}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--ink-2)} .small{font-size:14px}
.base{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bv{border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.bv span{font-size:13px;opacity:.85}
.bv b{font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.bv b small{font-size:15px;font-weight:500}
.bv em{font-style:normal;font-size:13px;font-weight:600}
.circles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center}
.circ{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);line-height:1.2}
.circ i{width:62px;height:62px;max-width:100%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.c-ok{background:var(--mint)} .c-watch{background:var(--pista)} .c-flag{background:var(--apricot);color:var(--apricot-ink)!important}
svg.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);padding:0 4px}
.legend i{display:inline-block;width:12px;height:8px;border-radius:3px;margin-right:5px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.habit{border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:8px}
.habit h3{font-size:18px;line-height:1.15}
.habit p{font-size:13px;line-height:1.4}
.mini{display:inline-flex;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.82);color:var(--ink);align-self:flex-start}
.mini.mine{background:var(--lime);color:var(--lime-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:13px 8px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex:none;font-weight:700;font-size:12px}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-weight:600}
.li .tx span{font-size:13px;color:var(--ink-2)}
.seg{display:inline-flex;background:var(--app);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;min-height:34px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--app)}
.ta{font-family:"Noto Sans Tamil",var(--font)}
.bubble{background:rgba(255,255,255,.12);border-radius:20px 20px 20px 6px;padding:14px 16px;font-size:15px;white-space:pre-wrap}
.linkbox{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border-radius:999px;padding:6px 6px 6px 16px}
.linkbox code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-family:var(--font)}
.chat{display:flex;flex-direction:column;gap:8px;padding:0 6px}
.msg{max-width:88%;padding:11px 14px;border-radius:20px;font-size:15px;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--app);border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--mint);color:var(--mint-ink);border-bottom-left-radius:6px}
.sugg{display:flex;gap:6px;overflow-x:auto;padding:0 6px 4px}
.sugg button{flex:none;border:1.5px solid var(--line);background:var(--app);border-radius:999px;min-height:38px;padding:0 12px;font-size:13px;font-weight:600;cursor:pointer}
textarea,input[type=text],input[type=number],select{width:100%;border:1.5px solid var(--line);background:var(--white);border-radius:18px;padding:11px 14px;font-size:16px;min-height:46px}
textarea{min-height:100px;resize:vertical;font-size:18px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--ink-2);min-width:0}
.q{font-size:25px;line-height:1.3;font-weight:600;letter-spacing:-.01em}
.qen{font-size:14px;opacity:.85}
.dots{display:flex;gap:5px}
.dots i{width:22px;height:5px;border-radius:3px;background:rgba(255,255,255,.3)}
.dots i.on{background:var(--lime)} .dots i.done{background:rgba(255,255,255,.85)}
.mic{width:60px;height:60px;border-radius:20px;background:var(--lime);color:var(--lime-ink);border:0;display:grid;place-items:center;cursor:pointer;flex:none}
.rv{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:20px;background:var(--white)}
.thinking{display:inline-flex;gap:5px}
.thinking i{width:8px;height:8px;border-radius:50%;background:currentColor;animation:b 1s infinite ease-in-out}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.thinking i{animation:none;opacity:.7}}
.track{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.track div{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;opacity:.6}
.track div.on{opacity:1}
.track i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;background:rgba(255,255,255,.15);flex:none}
.track .on i{background:var(--lime);color:var(--lime-ink)}
.mtile{border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:2px;text-decoration:none;border:0;text-align:left;cursor:pointer;min-height:118px;font:inherit}
.mtile .ico{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.75);display:grid;place-items:center;margin-bottom:8px}
.mtile b{font-size:16px;font-weight:600;line-height:1.2}
.mtile .s{font-size:12px;opacity:.85}
.persona{border:2px solid transparent;border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:4px;text-align:left;cursor:pointer;font:inherit}
.persona[aria-pressed="true"]{border-color:var(--ink)}
.persona b{font-size:17px;font-weight:600}
.persona .s{font-size:12px;opacity:.85}
.persona .say{font-size:13px;line-height:1.35;margin-top:6px}
.pav{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:17px;flex:none;margin-bottom:6px}
.pv-lime{background:var(--lime);color:var(--lime-ink)} .pv-euca{background:var(--forest);color:var(--on-forest)} .pv-pista{background:var(--white);color:var(--pista-ink)} .pv-moss{background:var(--moss-ink);color:var(--on-forest)}
.prog{display:flex;align-items:center;gap:4px}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.prog i.done{background:var(--moss)} .prog i.on{background:var(--forest)}
.prog span{flex:none;font-size:12px;color:var(--ink-2);margin-left:6px;white-space:nowrap}
.ivchat{padding:0}
.ivchat .msg{font-size:17px;line-height:1.45}
.msg small{display:block;font-size:13px;opacity:.75;margin-top:6px;font-family:var(--font)}

.rootchat .chat{min-height:280px;max-height:440px;overflow-y:auto;padding:4px 2px}

.chatform{display:flex;align-items:flex-end;gap:8px;background:var(--mint);border-radius:26px;padding:8px;margin:0 2px}

.chatform textarea:focus-visible{outline:none}

.attbtn{background:var(--white);color:var(--ink);width:48px;height:48px;cursor:pointer}
.micbtn{background:var(--lime);color:var(--lime-ink);width:48px;height:48px}

.rootchat .msg.ai{background:var(--mint)}
.lpill{border-color:rgba(255,255,255,.35);color:var(--on-forest);min-height:40px;padding:0 16px}

.scanrow .tx{display:flex;flex-direction:column;min-width:0}
.scanrow b{font-weight:600}
.scanrow .s{font-size:12px;opacity:.85}

  typicalCycle:[24,38], // FIGO 2018 (figo2018). ACOG uses 21–35 (shown as a tooltip).

};

   ${ticks.map(v=>`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" stroke="#E6EAE2"/><text x="${l-6}" y="${y(v)+4}" font-size="10" fill="#55635A" text-anchor="end">${v}</text>`).join("")}
   <rect x="${l}" y="${y(o.typical[1])}" width="${w}" height="${y(o.typical[0])-y(o.typical[1])}" fill="#EDF4E8"/>
   <rect x="${l}" y="${y(o.normal[1])}" width="${w}" height="${y(o.normal[0])-y(o.normal[1])}" rx="4" fill="#CBE3D2"/>
   ${ann}
   <polyline points="${vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ")}" fill="none" stroke="#1D4A37" stroke-width="2.5" stroke-linejoin="round"/>
   ${vals.map((v,i)=>{const cx=x(i).toFixed(1),cy=y(v).toFixed(1),last=i===vals.length-1,tip=`${labels[i]} · ${v} ${o.unit}${out(v)?" · outside your normal":""}`;
     return `<g class="ix-pt" data-tip="${esc(tip)}"><circle cx="${cx}" cy="${cy}" r="14" fill="transparent"/><circle cx="${cx}" cy="${cy}" r="${last?5.5:4}" fill="${out(v)?"#FFFFFF":"#1D4A37"}" stroke="#1D4A37" stroke-width="2"/><title>${esc(tip)}</title></g>`}).join("")}
   ${labels.map((m,i)=>`<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="10" fill="#55635A">${esc(m)}</text>`).join("")}</svg>`}

/* b2. heavy-flow bars */
function heavyBars(vals,base,labels){
  const W=360,H=150,l=30,r=10,t=22,b=22,w=W-l-r,h=H-t-b,mx=Math.max(5,...vals),bw=w/vals.length*.56,y=v=>t+h-v/mx*h;
  const up=v=>v>=base+RULES.heavyDelta;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(`Heavy-flow days per period over 12 months. Your normal is about ${Math.round(base)}; the last 3 periods averaged about ${Math.round(mean(vals.slice(-3)))}.`)}">
   <text x="0" y="12" font-size="11" fill="#55635A">days</text>
   ${Array.from({length:mx+1},(_,v)=>`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" stroke="#EEF1EA"/><text x="${l-6}" y="${y(v)+4}" font-size="10" fill="#55635A" text-anchor="end">${v}</text>`).join("")}
   ${vals.map((v,i)=>{const cx=l+(i+.5)*(w/vals.length);return `<rect x="${cx-bw/2}" y="${y(v)}" width="${bw}" height="${t+h-y(v)}" rx="4" fill="${up(v)?"#1D4A37":"#AFC8A0"}"><title>${esc(labels[i])} · ${v} heavy days</title></rect><text x="${cx}" y="${H-6}" text-anchor="middle" font-size="10" fill="#55635A">${esc(labels[i])}</text>`}).join("")}
   <line x1="${l}" x2="${W-r}" y1="${y(base)}" y2="${y(base)}" stroke="#15231B" stroke-dasharray="4 4"/>
   <text x="${l+4}" y="${y(base)-5}" font-size="11" font-weight="600" fill="#15231B">your normal (~${Math.round(base)})</text></svg>`}

/* c. body-signal small multiple */
function spark(vals,labels,o){
  const W=340,H=o.axis?92:72,l=30,r=10,t=10,b=o.axis?22:8,w=W-l-r,h=H-t-b;
  const mn=Math.min(...vals,o.band[0]),mx=Math.max(...vals,o.band[1]),pd=(mx-mn)*.15||1,lo=mn-pd,hi=mx+pd;
  const step=w/(vals.length-1),x=i=>l+i*step,y=v=>t+h-(v-lo)/(hi-lo)*h;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria)}">
   ${o.from>=0?`<rect x="${x(o.from)-step/2}" y="${t-4}" width="${W-r-(x(o.from)-step/2)}" height="${h+8}" fill="#F1F2EC"/>`:""}
   <rect x="${l}" y="${y(o.band[1])}" width="${w}" height="${Math.max(3,y(o.band[0])-y(o.band[1]))}" rx="3" fill="#CBE3D2"/>
   ${[o.band[0],o.band[1]].map(v=>`<text x="${l-6}" y="${y(v)+4}" font-size="10" fill="#55635A" text-anchor="end">${v}</text>`).join("")}
   <polyline points="${vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ")}" fill="none" stroke="#1D4A37" stroke-width="2.2" stroke-linejoin="round"/>
   <circle cx="${x(vals.length-1)}" cy="${y(vals[vals.length-1])}" r="4" fill="#1D4A37"/>
   ${o.axis?labels.map((m,i)=>`<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="10" fill="#55635A">${esc(m)}</text>`).join(""):""}</svg>`}

/* d. life timeline (age 30 → 60) */
function lifeTimeline(o){
  const W=360,H=140,l=14,r=14,w=W-l-r,x=a=>l+(a-30)/30*w,ax=88;
  const you=o.age,am=o.amma;
  const aria=`Life timeline from age 30 to 60. You are ${you}.${am?` ${A()}'s menopause came at ${am}.`:""} Before 45 is called early. The transition usually starts between 45 and 55. Average menopause is about 46 in India and about 52 in the US. Start watching from about 36.`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">
   <rect x="${x(45)}" y="38" width="${x(55)-x(45)}" height="${ax-38}" rx="6" fill="#D5EADB"/>
   <text x="${x(50)}" y="56" font-size="10" text-anchor="middle" fill="#1B4733">transition usually</text><text x="${x(50)}" y="68" font-size="10" text-anchor="middle" fill="#1B4733">starts 45–55</text>
   <rect x="${x(36)}" y="62" width="${x(44)-x(36)-2}" height="${ax-62}" rx="5" fill="#EEF6CF"/>
   <text x="${(x(36)+x(44))/2}" y="79" font-size="9.5" text-anchor="middle" fill="#3B4711">start watching ~36</text>
   <line x1="${x(45)}" x2="${x(45)}" y1="18" y2="${ax}" stroke="#15231B" stroke-width="1.2"/>
   <text x="${x(45)+4}" y="14" font-size="10.5" fill="#15231B">before 45 = early</text>
   ${am?`<line x1="${x(am)}" x2="${x(am)}" y1="18" y2="${ax}" stroke="#1D4A37" stroke-width="1.5" stroke-dasharray="3 3"/><text x="${x(am)-4}" y="14" font-size="10.5" text-anchor="end" font-weight="600" fill="#1D4A37">${esc(A())}'s menopause, ${am}</text>`:""}
   <line x1="${l}" x2="${W-r}" y1="${ax}" y2="${ax}" stroke="#15231B" stroke-width="1.5"/>
   ${[30,35,40,45,50,55,60].map(a=>`<line x1="${x(a)}" x2="${x(a)}" y1="${ax}" y2="${ax+4}" stroke="#15231B"/><text x="${x(a)}" y="${ax+16}" font-size="10" text-anchor="middle" fill="#55635A">${a}</text>`).join("")}
   <circle cx="${x(you)}" cy="${ax}" r="6" fill="#D3EE7C" stroke="#15231B" stroke-width="1.5"/><text x="${x(you)-4}" y="${ax-12}" font-size="11" font-weight="700" fill="#15231B">You, ${you}</text>
   <path d="M${x(46)} ${ax+22} l-4 6 h8z" fill="#55635A"/><text x="${x(46)+2}" y="${ax+40}" font-size="9.5" text-anchor="end" fill="#55635A">India avg ~46</text>
   <path d="M${x(52)} ${ax+22} l-4 6 h8z" fill="#55635A"/><text x="${x(52)-2}" y="${ax+40}" font-size="9.5" fill="#55635A">US avg ~52</text></svg>`}

function progressRing(n,of){const r=26,c=2*Math.PI*r,f=Math.min(1,n/of);
  return `<svg width="68" height="68" viewBox="0 0 68 68" role="img" aria-label="${n} of ${of} cycles logged"><circle cx="34" cy="34" r="${r}" fill="none" stroke="#DFE4DA" stroke-width="7"/><circle cx="34" cy="34" r="${r}" fill="none" stroke="#1D4A37" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c*f} ${c}" transform="rotate(-90 34 34)"/><text x="34" y="39" text-anchor="middle" font-size="15" font-weight="700" fill="#15231B">${n}/${of}</text></svg>`}

/* ============ insight cards ============ */
let DOCS={};           // doctor-list candidates on screen, rebuilt each render
let AIR={},AIBUSY=null; // "Ask about this" replies (memory only)
const cycleSteps={needs_answers:[["log","Log the start date of your next period"],["bring","Bring this card to your next visit"]],
  paused:[["test","Take a home pregnancy test"],["log","Log the start date of your next period"]],
  explained:[["log","Log the start date of your next period"],["bring","Bring this card to your next visit"]],
  signals:[["wake","Keep a steady wake time for 2 weeks"],["wind","Try a 10-minute wind-down before bed"],["log","Log the start date of your next period"]]};
function ansList(id){const qs=CHECKS[id].map(q=>q[0]).filter(k=>ansV(k)!=null);if(!qs.length)return "";
  return `<ul class="ix-ans" aria-label="Your answers">${qs.map(k=>`<li><span><b>${esc(SHORT[k])}:</b> ${esc(ansV(k))}${S.answers[k].note?` (${esc(S.answers[k].note)})`:""}</span><button type="button" class="ix-link" data-clear="${k}" data-card="${id}">Change answer<span class="sr"> for ${esc(SHORT[k])}</span></button></li>`).join("")}</ul>`}
function notRuledOut(id){const ks=CHECKS[id].map(q=>q[0]).filter(k=>["Not sure","Prefer not to say"].includes(ansV(k)));
  return ks.length?`<p class="small">Not ruled out, because you weren't sure or chose not to say: ${esc(ks.map(k=>SHORT[k].toLowerCase()).join(", "))}. That's okay; we've kept going.</p>`:""}
function questionBlock(id,key,qs){const i=qs.findIndex(q=>q[0]===key),q=qs[i][1];
  return `<p class="ix-q" id="q-${id}">${esc(q)}</p>
   <div class="ix-opts" role="group" aria-labelledby="q-${id}">${OPTS.map(o=>`<button type="button" class="ix-opt" data-ans="${key}" data-card="${id}" data-v="${o}">${o}</button>`).join("")}</div>
   ${key==="new_medication"?`<label class="f" for="note-${id}">What is it? (optional, then tap Yes)<input type="text" id="note-${id}" autocomplete="off"></label>`:""}
   <div class="ix-dots" aria-hidden="true">${qs.map((_,j)=>`<i class="${j<i?"done":j===i?"on":""}"></i>`).join("")}</div>`}
function bodyPanel(b){
  if(!b)return `<div class="ix-body"><p>No wearable data yet, so we can't compare body signals.</p></div>`;
  if(!b.claim)return `<div class="ix-body"><p>Your body signals look like your normal, so they probably aren't part of this.</p></div>`;
  const sm=Math.round(Math.abs(b.sleepMin)/10)*10;
  return `<div class="ix-body" id="body-panel"><p class="ix-lbl">Body signals</p>
   <p>Over the last 3 months you've slept about ${sm} minutes ${b.sleepMin<0?"less":"more"} a night, your resting heart rate is about ${Math.round(Math.abs(b.rhr))} beats per minute ${b.rhr>=0?"higher":"lower"}, and your HRV (heart rate variability, small changes in the time between heartbeats; higher usually means more rested) is about ${Math.round(Math.abs(b.hrvPct))}% ${b.hrvPct<0?"lower":"higher"} than your normal. Stress or short sleep <b>may be contributing</b>. Research links stress more with irregular cycles than with longer ones, so this is one possible piece, not the answer.</p>
   <p class="small muted">${b.movedN} of 3 signals moved past our limits (sleep 30+ minutes less, resting heart rate 3+ beats higher, HRV 10%+ lower). We only mention stress when at least 2 do.</p>
   <button type="button" class="ix-link" data-act="scrollbody">See the charts</button></div>`}

function cycleCard(s,V){
  const st=cardState("cycle"),qs=CHECKS.cycle,tsh=lab("TSH"),thy=fact("thyroid"),c=s.cyc;
  const inTyp=c.outTyp<2;
  const what=`<p>Your last 3 cycles averaged <b>${Math.round(c.rec)} days</b>. Your normal is ${c.normal.join("–")}. ${inTyp?`That's still inside the typical ${c.typ.join("–")}.`:`That's outside the typical ${c.typ.join("–")} too.`}</p>`;
  const strip=rangeStrip({min:20,max:40,typical:c.typ,normal:c.normal,now:c.rec,base:c.base,unit:"days",label:"Cycle length",round:true});
  let reasons="",tags=SRC_TAGS["cycle:"+st.base]||SRC_TAGS["cycle:needs_answers"],tag="";
  if(st.base==="needs_answers"){const i=qs.findIndex(q=>q[0]===st.next);tag=`<span class="small muted">Check-in · ${i+1} of ${qs.length}</span>`;
    reasons=(i===0?`<p class="small">Before looking at sleep or stress, a few quick questions can rule out common reasons. Tap "Not sure" or "Prefer not to say" any time.</p>`:"")+questionBlock("cycle",st.next,qs)+ansList("cycle")}
  else if(st.base==="paused")reasons=`<div class="ix-note"><p>A home pregnancy test is the simplest first step. We'll hold off on other explanations until you know.</p></div><button type="button" class="btn sm ghost" data-clear="pregnancy_possible" data-card="cycle">Update my answer</button>`;
  else if(st.base==="explained"){tags=SRC_TAGS["cycle:explained:"+st.why];
    reasons=`<div class="ix-note"><p><b>This may explain the change.</b> ${esc(EXPLAIN.cycle[st.why])}</p></div><button type="button" class="ix-link" data-act="override" data-card="cycle">Doesn't seem like the reason?</button>${ansList("cycle")}`}
  else reasons=`<p class="small">${st.why?"You said that reason doesn't seem to fit.":"The common reasons we asked about don't seem to fit."}</p>${notRuledOut("cycle")}${bodyPanel(bodySig())}${ansList("cycle")}`;
  const doctor=tsh&&st.base!=="needs_answers"&&st.base!=="paused"?{id:"cycle_doc",title:"A thyroid check",
    why:`Your TSH (thyroid-stimulating hormone) was ${tsh.value}${labState(tsh)==="watch"?", near the top of your lab's range":labState(tsh)==="flag"?", outside your lab's range":""}${thy?`, and ${A()} has a thyroid condition`:""}.`,
    ask:"Ask whether a thyroid recheck makes sense, given your longer cycles."}:null;
  return {id:"cycle",title:`Cycles getting ${c.dir}`,status:V.cyc,state:st.state,base:st.base,what,strip,reasons,ciTag:tag,tags,
    whatText:`Your last 3 cycles averaged ${Math.round(c.rec)} days. Your normal is ${c.normal.join("–")}. ${inTyp?"That's still inside":"That's outside"} the typical ${c.typ.join("–")}.`,
    steps:cycleSteps[st.base==="doctor"?"signals":st.base],doctor}}

function ironCard(s,V){
  const st=cardState("iron"),qs=CHECKS.iron,hb=lab("Hemoglobin"),fe=lab("Ferritin"),hv=fact("heavy_periods"),fib=fact("fibroids"),d=s.days,h=s.heavy;
  const labsTxt=[labLow(hb)&&`Your hemoglobin (the part of blood that carries oxygen) was ${hb.value} ${hb.unit}, below your lab's range of ${hb.lo}–${hb.hi}.`,
    labLow(fe)&&`Ferritin (your iron stores) was ${fe.value} ${fe.unit}, just below ${fe.lo}.`].filter(Boolean).join(" ");
  const whatText=`Your last 3 periods lasted about ${Math.round(d.rec)} days, up from ${Math.round(d.base)}. Heavy-flow days went from about ${Math.round(h.base)} to about ${Math.round(h.rec)} a period. Typical periods last up to ${RULES.typicalPeriodMax} days; more than 7 days is one sign of heavy bleeding.`;
  const what=`<p>${esc(whatText)}</p>${labsTxt?`<p>${esc(labsTxt)}</p>`:""}`;
  const strip=rangeStrip({min:0,max:10,typical:[1,RULES.typicalPeriodMax],typLabel:"typical: up to 8",typAria:"the typical range of up to 8 days",normal:d.normal,normLabel:`your normal ~${Math.round(d.base)}`,normText:`about ${Math.round(d.base)} days`,now:d.rec,base:d.base,baseLabel:`before ${fmt(d.base)}`,unit:"days",label:"Period length",round:true,approx:false});
  let reasons="",tag="";
  if(st.base==="needs_answers"){const i=qs.findIndex(q=>q[0]===st.next);tag=`<span class="small muted">Check-in · ${i+1} of ${qs.length}</span>`;
    reasons=(i===0?`<p class="small">Some common things can make periods heavier. A few quick questions first.</p>`:"")+questionBlock("iron",st.next,qs)+ansList("iron")}
  else if(st.base==="explained")reasons=`<div class="ix-note"><p><b>This may explain the change.</b> ${esc(EXPLAIN.iron[st.why])}</p></div><button type="button" class="ix-link" data-act="override" data-card="iron">Doesn't seem like the reason?</button>${ansList("iron")}`;
  else reasons=`<p class="small">${st.why?"You said that reason doesn't seem to fit.":"None of these common reasons seem to fit, so it's worth asking your doctor why."}</p>${notRuledOut("iron")}${ansList("iron")}`;
  const fam=[hv&&`${A()} had very heavy periods in her thirties`,fib&&`had fibroids at ${fib.num}`].filter(Boolean);
  const doctor=V.iron==="doctor"?{id:"iron_doc",title:"Heavier periods and lower iron",
    why:`${labsTxt||"Your periods have become heavier and longer."}${fam.length?` ${fam.join(" and ")}.`:""}`,
    ask:"Ask why your periods are heavier, and whether to recheck your iron."}:null;
  return {id:"iron",title:V.iron==="doctor"?"Heavier periods, lower iron":"Heavier, longer periods",status:V.iron,state:st.state,base:st.base,what,strip,reasons,ciTag:tag,tags:SRC_TAGS.iron,whatText,
    steps:[["pads","Note how often you change pads or tampons on your heaviest day"],["food","Add iron-rich foods like lentils, rajma, ragi or spinach, with lemon or amla"],["bring","Bring this card to your next visit"]],doctor}}

function buildCards(s,V){const o=[];
  if(V.iron!=="steady")o.push(ironCard(s,V));
  if(V.cyc!=="steady")o.push(cycleCard(s,V));
  const rank=c=>c.status==="care"?0:c.status==="doctor"?1:c.status==="changing"?(c.base==="needs_answers"?2:3):4;
  return o.sort((a,b)=>rank(a)-rank(b))}

function stepsHTML(cid,steps){S.cards[cid]=S.cards[cid]||{steps:{}};const c=S.cards[cid];c.steps=c.steps||{};
  return `<ul class="ix-steps">${steps.map(([sid,t])=>{const on=!!c.steps[sid];return `<li><button type="button" class="ix-step" data-step="${cid}:${sid}" aria-pressed="${on}"><span class="ix-box" aria-hidden="true">${on?IC.check:""}</span><span class="${on?"ix-done":""}">${esc(t)}</span></button></li>`}).join("")}</ul>`}
function doctorLine(d){DOCS[d.id]=d;const added=(S.doctor||[]).some(x=>x.id===d.id);

function askHTML(cd){

    ${r.ask?`<p class="ix-q" id="aiq-${cd.id}">${esc(r.ask.question)}</p><div class="ix-opts" role="group" aria-labelledby="aiq-${cd.id}">${r.ask.options.map(o=>`<button type="button" class="ix-opt" data-ans="${r.ask.key}" data-card="${cd.id}" data-v="${o}">${o}</button>`).join("")}</div>`:""}</div>`:"";
  return `<div class="ix-askwrap">${reply}${S.ui.ask===cd.id?`<form class="row" data-askcard="${cd.id}" style="flex-wrap:nowrap"><label class="sr" for="aq-${cd.id}">Your question about this card</label><input type="text" id="aq-${cd.id}" placeholder="Ask about this card" style="flex:1;min-width:0"${busy?" disabled":""}><button class="btn sm" type="submit"${busy?" disabled":""}>${busy?"…":"Ask"}</button></form>`:`<button type="button" class="btn sm ghost" data-act="askopen" data-card="${cd.id}">Ask about this</button>`}</div>`}
function cardHTML(cd){const src=search_literature(cd.tags);
  return `<article class="card t-white ix-card" id="card-${cd.id}" aria-labelledby="h-${cd.id}">
   <div class="head"><h3 id="h-${cd.id}">${esc(cd.title)}</h3>${statusPill(cd.status)}</div>
   <section class="ix-sec ix-what"><p class="ix-lbl">What changed</p>${cd.what}${cd.strip}</section>
   <section class="ix-sec"><div class="row between"><p class="ix-lbl">Possible reasons</p>${cd.ciTag}</div><div class="ix-ci" id="ci-${cd.id}" aria-live="polite" tabindex="-1">${cd.reasons}</div></section>
   <section class="ix-sec"><p class="ix-lbl">Small steps</p>${stepsHTML(cd.id,cd.steps)}</section>
   ${cd.doctor?doctorLine(cd.doctor):""}
   ${srcLink(src)}
   ${askHTML(cd)}</article>`}

/* ============ red flags, doctor list ============ */
const FLAGS=[["emerg","Soaking through a pad or tampon every hour for more than 2 hours, with dizziness, chest pain or shortness of breath"],
  ["between","Bleeding between periods or after sex"],["nop","No period for 3 months, with a negative pregnancy test"]];
function flagBanner(){const f=S.flags||{};if(!f.emerg&&!f.between&&!f.nop)return "";
  const em=!!f.emerg;
  return `<section class="card ix-banner" role="alert"><div class="head"><h3>${em?"Get emergency care now.":"See a doctor soon."}</h3>${statusPill("care")}</div>
   <p>${em?"Heavy bleeding with dizziness, chest pain or shortness of breath needs care right away. Call your local emergency number or go to the nearest emergency department.":`You marked: ${esc(FLAGS.filter(([k])=>f[k]).map(x=>x[1].toLowerCase()).join("; "))}. Book a visit with a doctor in the next few days.`}</p>
   <div class="row"><button type="button" class="btn sm light" data-act="clearflags">Clear these</button></div>${srcLink(litById("acog_aub"))}</section>`}
function flagPanel(){const f=S.flags||{};
  return `<section class="sheet" id="flagpanel"><div class="sheet-h"><h2>Something feels off?</h2><button type="button" class="ix-link" data-act="flags">Close</button></div>
   <p class="small" style="padding:0 8px">Tap anything that's happening now. These matter more than any trend on this page.</p>
   <div class="ix-flags">${FLAGS.map(([k,t])=>`<button type="button" class="ix-flag" data-flag="${k}" aria-pressed="${!!f[k]}"><span class="ix-box" aria-hidden="true">${f[k]?IC.check:""}</span><span>${esc(t)}</span></button>`).join("")}</div></section>`}
function docSummary(s){const L=[],d=new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}),b=bodySig();
  L.push(`Roots summary for my doctor (${d})`,`${S.me.name}, ${S.me.age}`,"");
  if(s.ready){const c=s.cyc,m=s.months;
    L.push(`Cycle log: ${s.n} cycles, ${m[0]}–${m[m.length-1]}. "My normal" = first ${RULES.baselineN} cycles (${m[0]}–${m[RULES.baselineN-1]}).`,
      `- Cycle length: last 3 averaged ${fmt(c.rec)} days (${c.recent.join(", ")}). My normal ${c.normal.join("–")}. Typical ${c.typ.join("–")}.`,
      `- Spread (shortest to longest, last ${RULES.spreadN}): ${c.spread} days.`,
      `- Period length: about ${fmt(s.days.rec)} days, was ${fmt(s.days.base)}.`,
      `- Heavy-flow days: about ${fmt(s.heavy.rec)} a period, was ${fmt(s.heavy.base)}.`)}

      ${hasR?rangeStrip({min:mn,max:mx,typical:[l.lo,l.hi],typLabel:`lab range ${l.lo}–${l.hi}`,typAria:`your lab's range of ${l.lo} to ${l.hi}`,now:l.value,unit:l.unit,label:I[0],sentence:words}):`<p class="ix-sent">${words}</p>`}</div>`}).join("")}</section>`:"";
  return summary+numbers+cardsSec+trend+bodySec+labsSec+`<p class="small muted">Roots shows patterns in your own data. It can't tell you what's causing a change; your doctor can help with that.</p>`}

  const tob=ansV("tobacco_use"),vd=lab("Vitamin D"),vdLow=labLow(vd);

   ${srcLink(litById("harlow_bleeding"))}${moreSrc(["niams_bone","owh_early","steiner2017"])}</section>`;
  const GAPS=[["tobacco_use","Do you smoke or use tobacco of any kind?",OPTS],

function habits(){const m=fact("menopause_age"),dia=fact("diabetes"),ns=m&&/sweat/i.test(m.value),hip=fact("family_osteoporosis"),vd=lab("Vitamin D");

/* ============ in-app AI ("Ask about this", artifact mode only) ============ */
const AI_SYS=`You are the Roots insight guide: warm, careful, brief. You explain changes in the user's own data compared with HER baseline ("your normal").

Rules:
1. Before linking a longer or less regular cycle to stress, check common alternatives first, ONE question per reply, in this order: possible pregnancy; birth control started, stopped or switched; big weight or exercise change; breastfeeding or birth in the past year; new medicines. Skip any already in ANSWERS. If any answer is yes or not sure, say this may be the reason and stop there unless the user says it doesn't fit.
2. Only when the alternatives are ruled out may you connect the change to sleep, resting heart rate or HRV, and only as "may be contributing". Never call stress the cause.
3. Never diagnose. Never write "you have" or "you will". Name a condition only as "worth discussing with your doctor".
4. Family history: say what to watch for and when to start preparing, and always say that family history raises the chance but does not decide the outcome.
5. A reply about a change includes what changed (numbers and units), possible reasons, 2-3 small steps, and exactly one source_id from LIBRARY. Never cite anything outside LIBRARY.
6. If you need missing information, ask for it with an "ask" object; the app saves the answer.

function sanitizeAI(r,fallback){let o=r;if(typeof o==="string"){try{o=JSON.parse(o.replace(/^```(json)?|```$/g,"").trim())}catch(e){o=null}}
  if(!o||typeof o!=="object")return {say:fallback,steps:[],source_id:null,ask:null,fallback:true};
  let say=typeof o.say==="string"?o.say.trim():"",steps=Array.isArray(o.steps)?o.steps.filter(x=>typeof x==="string").map(x=>x.trim()).filter(Boolean).slice(0,3):[];
  const source_id=LIT.some(e=>e.id===o.source_id)?o.source_id:null;
  let ask=o.ask&&typeof o.ask==="object"&&ANS_KEYS.includes(o.ask.key)&&typeof o.ask.question==="string"?{key:o.ask.key,question:o.ask.question.trim(),options:OPTS}:null;
  let fb=false;if(!say||lintText([say,...steps].join(" ")).length){say=fallback;steps=[];fb=true}

const FAM_GEN={me:0,sister:0,amma:1,appa:1,paati:2,thatha:2,appapaati:2,appathatha:2};
const FAM_MEAN=[
 [/pregnan|eclampsia/i,()=>"Daughters of women with high blood pressure in pregnancy had over twice the risk. Tell your OB-GYN before a pregnancy.",SRC.pe],
 [/menopause/i,n=>`${n}'s menopause came earlier than the typical 51. Yours may come early too, so ask about an AMH test before 35.`,SRC.meno],
 [/fibroid/i,()=>"Fibroids can run in families. With your periods getting heavier, it's worth mentioning to your doctor."],
 [/heavy period/i,()=>"Your own periods are getting heavier too. Bring this up together with your iron levels."],
 [/breast cancer/i,n=>`${n} was diagnosed young. Ask your doctor whether to start breast screening earlier.`,SRC.breast],
 [/diabetes|sugar/i,()=>"Type 2 diabetes in the family raises your own risk. A short walk after meals helps keep sugar steady."],
 [/thyroid/i,()=>"Thyroid conditions run in families. Ask about a thyroid recheck at your next visit."],
 [/hip|fracture|bone|osteo/i,()=>"A family history of hip fracture is a risk factor for weak bones. Strength training in your 30s helps."],
 [/\bbp\b|blood pressure|heart/i,()=>"High blood pressure in a parent raises your own risk. Get yours checked once a year."],
 [/painful period|endometri/i,()=>"Painful periods can run in families, and so can endometriosis. Mention it if yours are painful too."],
 [/pcos/i,()=>"PCOS often runs in families. Worth mentioning if your cycles become irregular."]];
function famMeaning(who,cs){const n=PEOPLE[who].n(),o=[],seen=new Set();
  cs.forEach(c=>{const m=FAM_MEAN.find(([re])=>re.test(c.t));if(!m)return;const t=m[1](n);if(seen.has(t))return;seen.add(t);o.push({t,src:m[2]})});
  return o}

/* ============ engines ============ */
const qFrom=(ch,qi)=>{const q=CH[ch].qs[Math.min(qi,CH[ch].qs.length-1)];return {text:useTa()?q.ta:q.en,en:q.en}};
function newInterview(){const p=PERSONAS[S.iv.persona||"niece"];Object.assign(S.iv,{started:true,done:false,submitted:false,ch:0,qi:0,turns:0,log:[]});S.facts=[];S.iv.cur=qFrom(0,0);S.iv.log.push({w:"q",t:useTa()?p.hi.ta:p.hi.en,en:p.hi.en},{w:"q",t:S.iv.cur.text,en:S.iv.cur.en});save();location.hash="interview";render()}
function next(){const iv=S.iv;iv.qi++;iv.turns++;let moved=false;if(iv.qi>=CH[iv.ch].qs.length){iv.ch++;iv.qi=0;iv.turns=0;moved=true}
  if(iv.ch>=CH.length){iv.done=true;return}const q=qFrom(iv.ch,iv.qi),k=iv.log.length%3;
  iv.cur={text:(useTa()?ACK[k]:ACKEN[k])+" "+q.text,en:ACKEN[k]+" "+(moved?`Now, ${CH[iv.ch].title.toLowerCase()}. `:"")+q.en}}
async function answer(text){const iv=S.iv,ch=iv.ch,d=CH[ch].demo[Math.min(iv.qi,CH[ch].demo.length-1)],isD=d&&d.a===text;
  const local=()=>(isD?d.f.map(f=>mkFact(f,ch,text)):[mkFact({label:CH[ch].title,value:text},ch,text)]).forEach(f=>S.facts.push(f));
  iv.log.push({w:"a",t:text});
  if(LIVE){BUSY=true;render();ctl=new AbortController();
    try{const r=await SAMPLE.json(ivPrompt(text),{modelTier:"quick",cache:false,signal:ctl.signal});
      const fs=(Array.isArray(r?.facts)?r.facts:[]).filter(f=>f&&f.label&&f.value);
      if(fs.length)fs.forEach(f=>S.facts.push(mkFact({label:String(f.label),value:String(f.value),key:KEYS.includes(f.key)?f.key:null,num:typeof f.num==="number"?f.num:null,rel:f.rel==="mother"?"mother":"self",sensitive:!!f.sensitive,chip:f.chip?String(f.chip):null,story:!!f.story},ch,text)));else local();
      iv.qi++;iv.turns++;if(r?.move_on||iv.turns>=3){iv.ch++;iv.qi=0;iv.turns=0}
      if(iv.ch>=CH.length)iv.done=true;else iv.cur={text:String(r?.reply||qFrom(iv.ch,iv.qi).text),en:String(r?.reply_en||"")}}
    catch(e){if(e?.code==="cancelled"){iv.log.pop();BUSY=false;render();return}
      if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e?.code))LIVE=false;
      toast("Using the guided questions.");local();next()}
    BUSY=false}else{local();next()}
  if(!iv.done)iv.log.push({w:"q",t:iv.cur.text,en:iv.cur.en});save();render()}
function ivPrompt(text){const c=CH[S.iv.ch],n=CH[S.iv.ch+1];
  return `You are ${PERSONAS[S.iv.persona||"niece"].style}, interviewing for Roots. ${S.me.mother}, a mother, tells her life and health story so her daughter ${S.me.name} can understand her own health. Speak only in simple, warm ${S.me.lang}. Never diagnose, judge, or ask about abuse or violence.
Chapter "${c.title}". Goal: ${c.goal}
${n?`Next chapter opening question: "${n.qs[0].en}"`:"This is the last chapter."}
Recent conversation:
${S.iv.log.slice(-6).map(x=>(x.w==="q"?"Interviewer: ":"Her: ")+x.t).join("\n")}
Her latest answer: "${text}"
Reply with only JSON: {"reply":"${S.me.lang}: one short acknowledgment, then exactly one question","reply_en":"English translation","facts":[{"label":"short English label","value":"short English fact","key":"one of ${KEYS.join(", ")} or null","num":null,"rel":"self or mother","sensitive":false,"story":false,"chip":"2-4 word English health-condition tag, or null if not a health condition"}],"move_on":false}
Set story true for life-context facts (where she grew up, cooking smoke, tobacco, first period). Set move_on true when this chapter is covered or she wants to skip; then ask the next chapter's opening question naturally, or thank her if this is the last chapter. Extract only facts she said; mark painful ones sensitive.`}
function context(){const people=Object.keys(PEOPLE).map(k=>{const c=conditions(k);return c.length?`${PEOPLE[k].n()} (${PEOPLE[k].r()}): ${c.map(x=>x.t).join(", ")}`:null}).filter(Boolean).join("\n");
  const s=sig();return `User: ${S.me.name}, ${S.me.age}. Cycle baseline ${Math.round(s.cyc.base)} days, now ${s.cyc.rec.toFixed(0)}; heavy days ${s.heavy.base.toFixed(0)} now ${s.heavy.rec.toFixed(0)}. Labs: ${S.labs.map(l=>`${l.name} ${l.value} ${l.unit} (range ${l.lo}-${l.hi})`).join("; ")}.\nFamily:\n${people}`}
async function ask(q){
  S.chat.push({r:"me",t:q});S.chat.push({r:"ai",t:"…"});save();render();
  const box=[...document.querySelectorAll("#chat .msg.ai")].pop();if(box)box.innerHTML=`<span class="thinking" aria-label="Thinking"><i></i><i></i><i></i></span>`;
  if(!SAMPLE){S.chat[S.chat.length-1].t="Open this app in Claude to ask questions. Your family data stays on this page.";save();render();return}
  try{const turns=[{role:"user",content:`You answer questions inside Roots, an app that helps a woman understand her family's health history. Be warm, plain and brief (under 90 words). Use only the data below. Never diagnose or give risk percentages you weren't given; suggest what to ask a doctor.\n\n${context()}`},...S.chat.slice(0,-1).slice(-8).map(m=>({role:m.r==="me"?"user":"assistant",content:m.t}))];
    const r=await SAMPLE(turns,{modelTier:"quick",cache:false,onText:({text})=>{if(box)box.textContent=text}});S.chat[S.chat.length-1].t=r.text;speak(r.text)}
  catch(e){S.chat[S.chat.length-1].t=e?.text||"I couldn't answer right now. Try again in a moment."}
  save();render()}
async function scan(file){toast("Reading the document…");
  try{const r=await SAMPLE.json(`This image is a medical document (lab report, discharge summary, prescription). Reply with only JSON: {"title":"short description of the document","person":"one of me, amma, appa, paati, thatha, sister, or unknown","conditions":["short condition tags with age or year if shown"],"labs":[{"name":"Ferritin","value":18,"unit":"ng/mL","lo":15,"hi":150}]}. Use [] when none. Only include what you can read clearly.`,{images:file});
    const who=PEOPLE[r?.person]?r.person:"me",cs=(Array.isArray(r?.conditions)?r.conditions:[]).map(String),ls=(Array.isArray(r?.labs)?r.labs:[]).filter(l=>l&&l.name&&typeof l.value==="number");
    cs.forEach(t=>S.family.push({id:nid(),who,text:t,src:"scan"}));if(who==="me")ls.forEach(l=>S.labs.push({name:String(l.name),short:String(l.name).slice(0,8),value:l.value,unit:String(l.unit||""),lo:typeof l.lo==="number"?l.lo:null,hi:typeof l.hi==="number"?l.hi:null}));
    const found=`Added to ${PEOPLE[who].n()}: ${[...cs,...ls.map(l=>l.name+" "+l.value)].join(", ")||"nothing readable"}`;S.scans.unshift({title:String(r?.title||"Document"),found});S.chat.push({r:"me",t:"Attached: "+String(r?.title||"a document")},{r:"ai",t:`I read your ${String(r?.title||"document").toLowerCase()}. ${found}. You can see it in Family.`});save();render();speak(found)}
  catch(e){toast(e?.code==="image_rejected"?"That image couldn't be read. Try a JPEG or PNG.":"Couldn't read the document right now.")}}

let REC=null;
function listen(btn,targetId){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition,box=document.getElementById(targetId);
  if(REC){REC.stop();return}
  if(!SR||!box){toast("Voice input isn't supported in this browser. Try Chrome, or type instead.");return}
  const r=new SR();r.lang=targetId==="answer"?({Tamil:"ta-IN",Hindi:"hi-IN",English:"en-IN"}[S.me.lang]):"en-IN";r.interimResults=true;r.continuous=false;
  const start=box.value?box.value.trim()+" ":"";
  r.onresult=e=>{let t="";for(const res of e.results)t+=res[0].transcript;box.value=start+t};
  r.onerror=e=>{toast(e.error==="not-allowed"||e.error==="service-not-allowed"?"Microphone isn't allowed here. Allow it in your browser, or type instead.":e.error==="no-speech"?"Didn't catch that. Tap the mic and try again.":"Voice input stopped. You can type instead.")};
  r.onend=()=>{REC=null;btn.classList.remove("on");btn.setAttribute("aria-label","Speak");box.focus()};
  try{r.start();REC=r;btn.classList.add("on");btn.setAttribute("aria-label","Stop listening");box.placeholder="Listening…"}catch(err){toast("Voice input isn't available here. Type instead.")}
}

  if(x=t.closest("[data-clear]")){delete S.answers[x.dataset.clear];const c=S.cards[x.dataset.card];if(c)c.override=false;FOCUS=ciFocus(x.dataset.card);save();render();return}
  if(x=t.closest("[data-step]")){const [cid,sid]=x.dataset.step.split(":"),c=S.cards[cid]||(S.cards[cid]={steps:{}});c.steps=c.steps||{};c.steps[sid]=!c.steps[sid];FOCUS=`[data-step="${cid}:${sid}"]`;save();render();return}
  if(x=t.closest("[data-docadd]")){const id=x.dataset.docadd,d=DOCS[id];if(S.doctor.some(y=>y.id===id)){S.doctor=S.doctor.filter(y=>y.id!==id);toast("Removed from your doctor list.")}else if(d){S.doctor.push({id,title:d.title,why:d.why,ask:d.ask,source_id:d.source_id||null,added:new Date().toISOString()});toast("Added to your doctor list.")}FOCUS=`[data-docadd="${id}"]`;save();render();return}
  if(x=t.closest("[data-docrm]")){S.doctor=S.doctor.filter(y=>y.id!==x.dataset.docrm);FOCUS="#docpanel h2";save();render();return}
  if(x=t.closest("[data-flag]")){S.flags[x.dataset.flag]=!S.flags[x.dataset.flag];FOCUS=`[data-flag="${x.dataset.flag}"]`;save();render();return}
  if(x=t.closest("[data-tip]")){const rd=x.closest("section")?.querySelector(".ix-read");if(rd)rd.textContent=x.dataset.tip;return}
  const b=t.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  if(a==="beginiv")newInterview();
  if(a==="toggleen"){S.iv.showEn=!S.iv.showEn;save();render()}
  if(a==="pause"){S.iv.started=false;S.iv.done=true;S.iv.submitted=S.facts.length>0;save();location.hash="root";toast("Paused. Her notes so far are saved.")}
  if(a==="demo"){const iv=S.iv,d=CH[iv.ch].demo[Math.min(iv.qi,CH[iv.ch].demo.length-1)],ta=document.getElementById("answer");if(d&&ta){ta.value=d.a;ta.focus()}}
  if(a==="skip"&&!BUSY){S.iv.log.push({w:"a",t:"(skipped)"});next();if(!S.iv.done)S.iv.log.push({w:"q",t:S.iv.cur.text,en:S.iv.cur.en});save();render()}
  if(a==="stop")ctl?.abort();
  if(a==="listen")listen(b,b.dataset.target);
  if(a==="speak"){S.ui.speak=!S.ui.speak;if(!S.ui.speak)try{speechSynthesis.cancel()}catch(err){};save();render();toast(S.ui.speak?"Replies will be read aloud.":"Read aloud is off.")}
  if(a==="send"){Object.assign(S.iv,{submitted:true,started:false,done:true,sharedOn:new Date().toLocaleDateString("en-US",{month:"short",day:"numeric"})});save();toast(`Sent to ${S.me.name}. Your tree is updated.`);location.hash="family"}
  if(a==="copyinvite"){const txt=INVITE[S.me.lang](S.me.name)+"\n\nhttps://"+inviteLink()+"?lang="+LCODE[S.me.lang];try{await navigator.clipboard.writeText(txt);toast("Invite copied. Paste it into WhatsApp.")}catch(err){toast("Copy isn't available here. Select the message to copy it.")}}
  if(a==="samplescan"){if(S.scans.some(s=>s.sample)){toast("That sample is already in your chat and tree.");return}S.family.push({id:nid(),who:"amma",text:"Preeclampsia, 1997",src:"scan"});S.scans.unshift({sample:1,title:"Hospital discharge note, 1997 (sample)",found:`Added to ${A()}: Preeclampsia, 1997.`});S.chat.push({r:"me",t:"Attached: hospital discharge note, 1997 (sample)"},{r:"ai",t:`I read it. It's from ${A()}'s second pregnancy and says "preeclampsia", which confirms the high blood pressure she described. I've added it to ${A()} in your Family tree. It's worth telling your OB-GYN if you plan a pregnancy.`});save();if(location.hash!=="#ask"&&location.hash!=="#root")location.hash="root";render()}
  if(a==="reset"){S=DEF();save();location.hash="insights";render();toast("Sample data restored.")}
  if(a==="clearans"){S.answers={};S.cards={};S.flags={};AIR={};save();render();toast("Your check-in answers are cleared.")}
  if(a==="doclist"){S.ui.doc=!S.ui.doc;S.ui.docText=false;FOCUS=S.ui.doc?"#docpanel h2":".ix-docchip";save();render()}
  if(a==="flags"){S.ui.flags=!S.ui.flags;FOCUS=S.ui.flags?"#flagpanel .ix-flag":'[data-act="flags"]';save();render()}
  if(a==="clearflags"){S.flags={};save();render()}
  if(a==="startci"){const el=document.getElementById("card-"+b.dataset.card);if(el){el.scrollIntoView({block:"start",behavior:RM()?"auto":"smooth"});(el.querySelector(".ix-opt")||el).focus({preventScroll:true})}}
  if(a==="override"){const c=S.cards[b.dataset.card]||(S.cards[b.dataset.card]={steps:{}});c.override=true;FOCUS=ciFocus(b.dataset.card);save();render()}
  if(a==="scrollbody")document.getElementById("body-signals")?.scrollIntoView({block:"start",behavior:RM()?"auto":"smooth"});
  if(a==="hotflash")save_answer("hot_flash_log","Seen");
  if(a==="docans"){S.ui.docAns=b.checked;save();render()}
  if(a==="copydoc"){const txt=docSummary(sig());try{await navigator.clipboard.writeText(txt);toast("Summary copied. Paste it into a message or notes.")}catch(err){S.ui.docText=true;save();render();toast("Copy isn't available here. The summary is below to select.")}}
  if(a==="askopen"){S.ui.ask=b.dataset.card;FOCUS="#aq-"+b.dataset.card;save();render()}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&e.target.id==="chatQ"){e.preventDefault();e.target.form.requestSubmit();return}if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-open]")){e.preventDefault();e.target.click()}});
document.addEventListener("change",e=>{if(e.target.id==="scanFile"&&e.target.files[0])scan(e.target.files[0])});
document.addEventListener("submit",e=>{e.preventDefault();const id=e.target.id,v=x=>document.getElementById(x).value.trim();
  if(id==="answerForm"){if(!v("answer")){toast("Type her answer first, or tap Skip.");return}answer(v("answer"))}
  if(id==="chatForm"){const q=v("chatQ");if(!q){toast("Type a question first.");return}ask(q)}
  if(id==="famForm"){if(!v("mText")){toast("Describe the condition first.");return}if(S.ui.person==="me")S.conds.push(v("mText"));else S.family.push({id:nid(),who:S.ui.person,text:v("mText"),src:"you"});save();render();toast("Added to your tree.")}
  if(e.target.dataset.askcard){const q=document.getElementById("aq-"+e.target.dataset.askcard)?.value.trim();if(!q){toast("Type a question first.");return}askCard(e.target.dataset.askcard,q);return}
  if(id==="setForm"){S.me.name=v("sName")||"Kavya";S.me.call=v("sCall")||"Amma";S.me.lang=v("sLang");save();render();toast("Saved.")}
});
assertSources();
render();
(async()=>{try{SAMPLE=window.claude?await window.claude.use("sample"):null}catch(e){SAMPLE=null}LIVE=!!SAMPLE;
  if(SAMPLE){try{IMAGES=!!(await SAMPLE.limits())?.images}catch(e){}}render()})();
if(/[?&]test\b/.test(location.search)){const sc=document.createElement("script");sc.src="tests/insights-tests.js";document.body.appendChild(sc)}
</script>
